name: Déploiement GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/configure-pages@v6

      - name: Injecter le hash du commit comme version
        run: sed -i "s/__VERSION__/${GITHUB_SHA::8}/g" src/index.html

      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./src

      - id: deployment
        uses: actions/deploy-pages@v5
